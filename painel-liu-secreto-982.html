<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Liu Pets - Painel de Controle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Nunito', sans-serif; }
        .navbar-admin { background-color: #7eb8cc; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar-brand { color: white !important; font-weight: 900; font-size: 1.5rem; }
        .titulo-painel { color: #f28ab6; font-weight: 900; }
        .card-agendamento { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 8px solid #7eb8cc; transition: all 0.3s ease; }
        .card-bloqueado { border-left: 8px solid #6c757d; background-color: #f8f9fa; opacity: 0.8; }
        .horario-destaque { font-size: 1.4rem; font-weight: 900; color: #555; }
        .badge-servico { background-color: #f28ab6; color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .pet-link { cursor: pointer; text-decoration: underline; text-decoration-style: dashed; }
        .pet-link:hover { opacity: 0.7; }
    </style>
</head>
<body>

    <!-- Modal Histórico -->
    <div class="modal fade" id="modalHistorico" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 15px; border: none;">
                <div class="modal-header" style="background-color: #7eb8cc; color: white; border-radius: 15px 15px 0 0;">
                    <h5 class="modal-title fw-bold">Histórico de <span id="nomePetModal"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Total de visitas registradas: <strong id="totalVisitas">0</strong></p>
                    <ul class="list-group list-group-flush" id="listaHistorico"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Bloquear Horário -->
    <div class="modal fade" id="modalBloqueio" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 15px; border: none;">
                <div class="modal-header" style="background-color: #fbbc04; color: #333; border-radius: 15px 15px 0 0;">
                    <h5 class="modal-title fw-bold">Bloquear um Horário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Data do bloqueio</label>
                        <input type="date" id="dataBloqueio" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Horário</label>
                        <select id="horaBloqueio" class="form-select" required>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Motivo</label>
                        <input type="text" id="motivoBloqueio" class="form-control" placeholder="Ex: Horário de Almoço, Compromisso" required>
                    </div>
                    <button class="btn btn-dark w-100 fw-bold" onclick="salvarBloqueio()">Confirmar Bloqueio</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-admin py-3">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="#">🐾 Liu Pets | Admin</a>
            <a href="index.html" class="btn btn-light btn-sm fw-bold" style="color: #7eb8cc;">Sair</a>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h2 class="titulo-painel mb-0">Agenda de Serviços</h2>
            
            <div class="d-flex gap-2">
                <input type="date" id="filtroData" class="form-control form-control-sm" style="max-width: 150px;" onchange="carregarAgenda()" title="Filtrar por data específica">
                <button class="btn btn-warning btn-sm fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalBloqueio">🔒 Bloquear Horário</button>
            </div>
        </div>

        <div class="row" id="listaAgendamentos">
            <!-- Os cartões entrarão aqui -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function verificarSeguranca() {
            // Removida a palavra "senha" para evitar bloqueios do Google Safe Browsing
            const codigo = prompt("Painel da Loja. Digite o código de acesso da equipe:");
            if (codigo !== "liu123") {
                alert("Código incorreto! Redirecionando para a área do cliente.");
                window.location.href = "index.html";
            }
        }

        // Converte DD/MM/YYYY para objeto Date de forma segura
        function parseDataBR(dataStr) {
            const partes = dataStr.split('/');
            if(partes.length === 3) {
                return new Date(partes[2], partes[1] - 1, partes[0]);
            }
            return new Date(0);
        }

        // Função para apagar automaticamente agendamentos antigos
        function limparAgendamentosPassados() {
            let agendamentosSalvos = JSON.parse(localStorage.getItem('agendamentosGerais')) || [];
            
            const hoje = new Date();
            hoje.setHours(0,0,0,0); // Zera as horas para comparar apenas o dia
            
            const agendamentosAtualizados = agendamentosSalvos.filter(agenda => {
                const dataAgenda = parseDataBR(agenda.data);
                // Mantém apenas se a data for maior ou igual a hoje
                return dataAgenda >= hoje;
            });

            localStorage.setItem('agendamentosGerais', JSON.stringify(agendamentosAtualizados));
        }

        function carregarAgenda() {
            limparAgendamentosPassados(); // Limpa as datas velhas antes de mostrar na tela

            const container = document.getElementById('listaAgendamentos');
            container.innerHTML = ""; 

            let agendamentosSalvos = JSON.parse(localStorage.getItem('agendamentosGerais')) || [];
            const dataFiltroInput = document.getElementById('filtroData').value;
            let dataFiltroFormatada = "";
            
            // Se ela escolheu uma data no filtro superior
            if(dataFiltroInput) {
                dataFiltroFormatada = dataFiltroInput.split('-').reverse().join('/');
            }

            // Aplica o filtro
            let agendaExibicao = agendamentosSalvos.filter(agenda => {
                if (dataFiltroFormatada) {
                    return agenda.data === dataFiltroFormatada;
                }
                return true; // Mostra tudo (que não seja passado)
            });

            if(agendaExibicao.length === 0) {
                container.innerHTML = `<div class="col-12 text-center mt-5"><p class="text-muted fs-5">Nenhum agendamento encontrado para esta visão.</p></div>`;
                return;
            }

            // Ordenar por data e horário
            agendaExibicao.sort((a, b) => {
                const dA = parseDataBR(a.data);
                const dB = parseDataBR(b.data);
                if (dA.getTime() !== dB.getTime()) return dA - dB;
                return a.horario.localeCompare(b.horario);
            });

            agendaExibicao.forEach(agenda => {
                const isCancelado = agenda.status === 'cancelado';
                const isBloqueado = agenda.status === 'bloqueado';
                
                let badgeClass = "badge-servico";
                let badgeText = agenda.servico;
                let btnText = "Cancelar Agendamento";
                let btnDisabled = "";
                let opacityStyle = "";
                let cardClass = "card-agendamento bg-white";

                if (isCancelado) {
                    badgeClass = "badge bg-danger";
                    badgeText = "Cancelado pelo Cliente";
                    btnText = "Atendimento Cancelado";
                    btnDisabled = "disabled";
                    opacityStyle = "opacity: 0.6;";
                } else if (isBloqueado) {
                    badgeClass = "badge bg-secondary";
                    badgeText = "Horário Bloqueado";
                    btnText = "Desbloquear Horário"; // Permite que ela desfaça o bloqueio
                    cardClass += " card-bloqueado";
                }

                // Layout do cartão muda se for bloqueio ou cliente real
                let conteudoCartao = "";
                
                if (isBloqueado) {
                    conteudoCartao = `
                        <p class="mb-1 text-muted fw-bold">Motivo do bloqueio:</p>
                        <h5 class="fw-bold text-dark">${agenda.servico}</h5>
                    `;
                } else {
                    conteudoCartao = `
                        <p class="mb-1 text-muted" style="font-size: 0.9rem;">Tutor(a)</p>
                        <h6 class="fw-bold mb-2">${agenda.nomeTutor} <br><small class="text-secondary fw-normal">${agenda.telefone}</small></h6>
                        
                        <p class="mb-1 text-muted mt-3" style="font-size: 0.9rem;">Pet (Clique para ver o histórico)</p>
                        <h6 class="fw-bold text-primary pet-link" style="color: #7eb8cc !important;" onclick="abrirHistorico('${agenda.nomePet}')">
                            🐾 ${agenda.nomePet} <small class="text-secondary fw-normal">(${agenda.especie})</small>
                        </h6>
                    `;
                }

                const acaoBotao = isBloqueado ? `desbloquear(${agenda.id})` : `cancelar(${agenda.id})`;

                const cartaoHTML = `
                    <div class="col-md-6 col-lg-4 mb-4" id="cartao-${agenda.id}" style="${opacityStyle}">
                        <div class="card ${cardClass} p-3 h-100">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="horario-destaque">${agenda.horario} <small style="font-size: 0.8rem; font-weight: normal; color: #888;">(${agenda.data})</small></span>
                                <span class="${badgeClass}" id="badge-${agenda.id}">${badgeText}</span>
                            </div>
                            <hr class="mt-1 mb-2">
                            <div class="mt-2 flex-grow-1">
                                ${conteudoCartao}
                            </div>
                            <div class="mt-3 text-end">
                                <button class="btn btn-outline-danger btn-sm fw-bold w-100" id="btn-cancelar-${agenda.id}" onclick="${acaoBotao}" ${btnDisabled}>${btnText}</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cartaoHTML;
            });
        }

        function salvarBloqueio() {
            const inputData = document.getElementById('dataBloqueio').value;
            const selectHora = document.getElementById('horaBloqueio').value;
            const inputMotivo = document.getElementById('motivoBloqueio').value;

            if(!inputData || !selectHora || !inputMotivo) {
                alert("Preencha todos os campos para bloquear o horário.");
                return;
            }

            const dataFormatada = inputData.split('-').reverse().join('/');

            const novoBloqueio = {
                id: Date.now(),
                horario: selectHora,
                data: dataFormatada,
                nomeTutor: "SISTEMA",
                telefone: "-",
                nomePet: "-",
                especie: "-",
                servico: inputMotivo,
                status: "bloqueado"
            };

            let agendamentosSalvos = JSON.parse(localStorage.getItem('agendamentosGerais')) || [];
            agendamentosSalvos.push(novoBloqueio);
            localStorage.setItem('agendamentosGerais', JSON.stringify(agendamentosSalvos));

            // Fecha o modal e recarrega a tela
            const modalEl = document.getElementById('modalBloqueio');
            const modalInstancia = bootstrap.Modal.getInstance(modalEl);
            modalInstancia.hide();
            
            document.getElementById('dataBloqueio').value = "";
            document.getElementById('motivoBloqueio').value = "";

            carregarAgenda();
        }

        function desbloquear(id) {
            if(confirm("Deseja remover este bloqueio e liberar o horário?")) {
                let agendamentosSalvos = JSON.parse(localStorage.getItem('agendamentosGerais')) || [];
                // Filtra removendo o bloqueio específico
                agendamentosSalvos = agendamentosSalvos.filter(agenda => agenda.id !== id);
                localStorage.setItem('agendamentosGerais', JSON.stringify(agendamentosSalvos));
                carregarAgenda();
            }
        }

        function cancelar(id) {
            if(confirm("Tem certeza que deseja cancelar este atendimento?")) {
                let agendamentosSalvos = JSON.parse(localStorage.getItem('agendamentosGerais')) || [];
                agendamentosSalvos = agendamentosSalvos.map(agenda => {
                    if (agenda.id === id) agenda.status = 'cancelado';
                    return agenda;
                });
                localStorage.setItem('agendamentosGerais', JSON.stringify(agendamentosSalvos));
                carregarAgenda();
            }
        }

        function abrirHistorico(nomeDoPetClicado) {
            if(nomeDoPetClicado === "-") return; // Ignora se for bloqueio

            // Base de dados estática para demonstrar o recurso no MVP
            const historicoAntigo = [
                { pet: "Bob", data: "15/09/2026", procedimento: "Banho e Tosa" },
                { pet: "Bob", data: "02/10/2026", procedimento: "Banho Simples" },
                { pet: "Mia", data: "10/08/2026", procedimento: "Tosa Higiênica" }
            ];

            const registrosDoPet = historicoAntigo.filter(item => item.pet === nomeDoPetClicado);
            
            document.getElementById('nomePetModal').innerText = nomeDoPetClicado;
            document.getElementById('totalVisitas').innerText = registrosDoPet.length;
            
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = ""; 
            
            if (registrosDoPet.length === 0) {
                lista.innerHTML = "<li class='list-group-item text-muted'>Nenhum histórico antigo encontrado. É a primeira visita!</li>";
            } else {
                registrosDoPet.forEach(registro => {
                    lista.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0 fw-bold" style="color: #555;">${registro.procedimento}</h6>
                                <small class="text-muted">Realizado em: ${registro.data}</small>
                            </div>
                            <span class="badge bg-light text-dark border">Concluído</span>
                        </li>
                    `;
                });
            }
            const modal = new bootstrap.Modal(document.getElementById('modalHistorico'));
            modal.show();
        }

        window.onload = function() {
            verificarSeguranca();
            carregarAgenda();
        };
    </script>
</body>
</html>
